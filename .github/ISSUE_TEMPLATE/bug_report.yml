name: Bug report
description: Report a reproducibility, validation or tooling defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide commands and public-safe inputs.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
  - type: checkboxes
    id: safety
    attributes:
      label: Publication safety
      options:
        - label: I removed credentials, private paths and restricted data.
          required: true
